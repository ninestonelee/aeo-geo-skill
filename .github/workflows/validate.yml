name: Classroom validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-tests:
    strategy:
      matrix:
        python-version: ['3.11', '3.14']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run offline classroom tests
        run: python -m unittest discover -s tests -v
      - name: Build classroom ZIP
        run: python scripts/build_release.py --version v1.0.0
